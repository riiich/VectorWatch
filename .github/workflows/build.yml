name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: windows-latest
            compiler: msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer:
          - ASAN_UBSAN
          - TSAN
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-${{ matrix.sanitizer }}
          -DCMAKE_BUILD_TYPE=Debug
          -DVECTORWATCH_ENABLE_${{ matrix.sanitizer }}=ON
      - name: Build
        run: cmake --build build-${{ matrix.sanitizer }} --parallel
      - name: Test
        run: ctest --test-dir build-${{ matrix.sanitizer }} --output-on-failure

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/client/package-lock.json
      - name: Build native bridge
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug && cmake --build build --parallel
      - name: Native ABI checks
        run: python3 web/tests/native_integration.py "$PWD/build/libvectorwatch_native.so"
      - name: Install client dependencies
        run: npm --prefix web/client ci
      - name: Build client and server
        run: npm --prefix web/client run build && dotnet build web/server
      - name: SignalR integration checks
        run: npm --prefix web/client run test:integration
